    <script>
      // Automatic GitHub Pages redirect when served from uncompiled repository root
      (function() {
        var host = window.location.hostname;
        if (host.endsWith('github.io')) {
          var path = window.location.pathname;
          if (!path.includes('/docs/')) {
            var segments = path.split('/').filter(Boolean);
            var repo = segments.length > 0 ? '/' + segments[0] : '';
            var subpath = segments.slice(1).join('/');
            var target = repo + '/docs/' + (subpath ? '#' + subpath : '') + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        }
      })();

      // Gracefully prevent unhandled cross-origin or external Script errors from interrupting execution
      window.addEventListener('error', function(e) {
        if (e && (e.message === 'Script error.' || !e.filename)) {
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && !e.reason) {
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
        }
      });
    </script>
